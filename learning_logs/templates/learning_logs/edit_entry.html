{%extends 'learning_logs/base.html'%}

{% block page_header %}
    <h3><a href="{% url 'learning_logs:entries' topic.id %}">{{topic}}</a></h3>
{% endblock page_header %}

{% block content %}

    <form action="{% url 'learning_logs:edit_entry' entry.id %}" method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button name="submit" class="btn btn-primary btn-sm">Save changes</button>
    </form>
{% endblock content %}
